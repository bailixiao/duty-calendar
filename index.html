<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f1e7">
  <title>教全區行事曆</title>
  <!-- 加到手機主畫面時的圖示與名稱 -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="教全區行事曆">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <!-- 先跟 Google 建好連線（資料 API 會從 script.google.com 轉到 googleusercontent），第一次讀資料比較快 -->
  <link rel="preconnect" href="https://duty-calendar-api.duty-calendar-worker.workers.dev" crossorigin>
  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css?v=20261010g">
  <script>try { var t = localStorage.getItem('duty-calendar:text-size'); if (t === 'l' || t === 'xl') document.documentElement.classList.add('text-' + t); } catch (e) {}</script>
</head>
<body class="splash-on">
  <!-- 開場動畫（見 app.js）：logo 由小變大再放大淡出 → 打出網站名稱 → 名稱移到左上角；同時在背景讀取行事曆與近期勤務 -->
  <div id="splash" class="splash" aria-hidden="true">
    <div class="splash-bg"></div>
    <img class="splash-logo" src="icons/icon-512.png" alt="" width="168" height="168">
    <p class="splash-title" data-splash-title></p>
  </div>
  <header class="app-header">
    <a class="app-title" href="#/"><span class="header-back" aria-hidden="true">‹</span><span data-site="name">教全區行事曆</span></a>
    <button type="button" class="text-size-btn" id="text-size" aria-label="字體大小">A＋</button>
  </header>

  <main class="app-main">
    <section id="view-calendar" aria-label="行事曆">
      <div class="toolbar">
        <div class="view-switch" role="group" aria-label="切換檢視">
          <button type="button" data-view="year">年</button>
          <button type="button" data-view="month">月</button>
          <button type="button" data-view="week">週</button>
          <button type="button" data-view="recent">近期</button>
        </div>
        <div class="nav">
          <button type="button" id="cal-prev" class="btn btn-icon" aria-label="上一段">‹</button>
          <h1 id="cal-title" class="cal-title" aria-live="polite"></h1>
          <button type="button" id="cal-next" class="btn btn-icon" aria-label="下一段">›</button>
          <button type="button" id="cal-today" class="btn btn-ghost">今天</button>
        </div>
      </div>

      <div class="top-links">
        <a class="btn mine-link" href="#/mine">查我的報名（取消／改期）</a>
        <a class="btn mine-link venue-link" href="#/venue" data-feature="venue" data-site-tpl="🏠 借{venue}場地">🏠 借區中心場地</a>
        <div class="top-links-row">
          <button type="button" class="btn push-link" id="push-open">🔔 手機提醒</button>
          <a class="btn push-link help-link" href="#/help">❓ 常見問題</a>
        </div>
      </div>
      <div id="push-card" class="push-card" hidden></div>
      <div id="my-next" class="my-next" hidden></div>

      <div id="cat-filter" class="cat-filter" role="group" aria-label="類別" hidden>
        <button type="button" data-cat="全部">全部</button>
        <button type="button" data-cat="勤務" data-site-cat="勤務">總務・勤務</button>
        <button type="button" data-cat="道務" data-site-cat="道務">道務</button>
        <button type="button" data-cat="教育" data-site-cat="教育">教育</button>
        <button type="button" data-cat="場地">借場地</button>
      </div>

      <div id="cal-status" class="status" role="status" hidden></div>

      <button type="button" id="past-toggle" class="btn past-toggle" hidden></button>
      <div id="fc" class="calendar"></div>
      <div id="week" class="week" hidden></div>

      <ul class="legend" aria-label="色點說明">
        <li><i class="dot dot-short"></i>缺人</li>
        <li><i class="dot dot-full"></i>額滿</li>
        <li><i class="dot dot-ok"></i>人數足（至少 2 人）</li>
        <li><i class="dot dot-notice"></i>公告（不需報名）</li>
        <li data-feature="venue"><i class="dot dot-venue"></i><span data-site-tpl="{venue}場地已借出">區中心場地已借出</span></li>
      </ul>

      <section id="day-panel" class="day-panel" aria-live="polite"></section>
    </section>

    <section id="view-duty" class="duty-view" hidden></section>
    <section id="view-mine" class="mine-view" hidden></section>
    <section id="view-grid" class="grid-view" hidden></section>
    <section id="view-venue" class="mine-view" hidden></section>
    <section id="view-admin" class="admin-view" hidden></section>
    <section id="view-help" class="help-view" hidden></section>
    <section id="view-rollcall" class="mine-view" hidden></section>
  </main>

  <footer class="app-footer"><a href="#/admin">管理者</a></footer>

  <div id="busy" class="busy" role="alertdialog" aria-modal="true" aria-live="assertive" hidden>
    <div class="busy-box">
      <span class="spinner" aria-hidden="true"></span>
      <p class="busy-text"></p>
      <p class="busy-sub"></p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/lunar-javascript@1.7.7/lunar.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.21/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.21/locales/zh-tw.global.min.js"></script>
  <!-- 改了 js、css 後把 ?v= 的日期換新，手機才不會用到舊的檔案（GitHub Pages 會快取 10 分鐘） -->
  <script src="js/site.js?v=20261010g"></script>
  <script src="js/config.js?v=20261010g"></script>
  <script src="js/api.js?v=20261010g"></script>
  <script src="js/format.js?v=20261010g"></script>
  <script src="js/lunar-util.js?v=20261010g"></script>
  <script src="js/date-list.js?v=20261010g"></script>
  <script src="js/share.js?v=20261010g"></script>
  <script src="js/addcal.js?v=20261010g"></script>
  <script src="js/duty-cache.js?v=20261010g"></script>
  <script src="js/calendar.js?v=20261010g"></script>
  <script src="js/confirm.js?v=20261010g"></script>
  <script src="js/reschedule.js?v=20261010g"></script>
  <script src="js/signup.js?v=20261010g"></script>
  <script src="js/duty-images.js?v=20261010g"></script>
  <script src="js/roster-grid.js?v=20261010g"></script>
  <script src="js/grid-page.js?v=20261010g"></script>
  <script src="js/duty.js?v=20261010g"></script>
  <script src="js/mine.js?v=20261010g"></script>
  <script src="js/venue.js?v=20261010g"></script>
  <script src="js/push.js?v=20261010g"></script>
  <script src="js/admin.js?v=20261010g"></script>
  <script src="js/admin-pages.js?v=20261010g"></script>
  <script src="js/draft-editor.js?v=20261010g"></script>
  <script src="js/admin-duties.js?v=20261010g"></script>
  <script src="js/admin-accounts.js?v=20261010g"></script>
  <script src="js/import-parse.js?v=20261010g"></script>
  <script src="js/admin-import.js?v=20261010g"></script>
  <script src="js/admin-people.js?v=20261010g"></script>
  <script src="js/stats-calc.js?v=20261010g"></script>
  <script src="js/edu-stats.js?v=20261010g"></script>
  <script src="js/admin-goals.js?v=20261010g"></script>
  <script src="js/admin-venue.js?v=20261010g"></script>
  <script src="js/admin-push.js?v=20261010g"></script>
  <script src="js/tutorial.js?v=20261010g"></script>
  <script src="js/help.js?v=20261010g"></script>
  <script src="js/rollcall.js?v=20261010g"></script>
  <script src="js/stats-export.js?v=20261010g"></script>
  <script src="js/repair.js?v=20261010g"></script>
  <script src="js/member-stats.js?v=20261010g"></script>
  <script src="js/admin-stats.js?v=20261010g"></script>
  <script src="js/history-parse.js?v=20261010g"></script>
  <script src="js/admin-history.js?v=20261010g"></script>
  <script src="js/app.js?v=20261010g"></script>
</body>
</html>
