# Cloudflare Worker 設定（部署前先執行 node tools/build-worker.js 產生 src/gs.generated.js）
name = "duty-calendar-api"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "DB"
class_name = "DutyStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DutyStore"]

# 台北 07:00 與 20:00 的手機提醒（UTC 23:00、12:00）
[triggers]
crons = ["0 23 * * *", "0 12 * * *", "*/5 * * * *"]

[observability]
enabled = true
